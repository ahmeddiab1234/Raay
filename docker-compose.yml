services:
  raay-sentiment:
    image: raay-sentiment:latest
    build:
      context: .
    ports:
      - "8000:3000"
    environment:
      RAAY_ONNX_PATH: /home/bentoml/bento/src/models/onnx/model_int8.onnx
      RAAY_TOKENIZER_DIR: /home/bentoml/bento/src/models/baseline/final
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ALLOW_FILE_STORE: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Phase 5 step 4 canary worker: same image, distilled fp32 graph (bound
  # read-only over the baked int8). No host port -- nginx reaches it by
  # compose service name on the private network.
  raay-sentiment-canary:
    image: raay-sentiment:latest
    environment:
      RAAY_ONNX_PATH: /home/bentoml/bento/src/models/onnx/distilled.onnx
      RAAY_TOKENIZER_DIR: /home/bentoml/bento/src/models/distilled/final
      RAAY_REGISTERED_MODEL: ArabicSentimentDistilled
      RAAY_ALIAS: Canary
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ALLOW_FILE_STORE: "true"
    volumes:
      - ./models/onnx/distilled.onnx:/home/bentoml/bento/src/models/onnx/distilled.onnx:ro
      - ./models/onnx/distilled.onnx.data:/home/bentoml/bento/src/models/onnx/distilled.onnx.data:ro
      - ./models/distilled/final:/home/bentoml/bento/src/models/distilled/final:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Phase 5 step 4 canary front: nginx:alpine, 95/5 weighted split over the
  # prod (int8) + canary (distilled fp32) workers. Additive: :8000 is
  # untouched; :8081 is the canary front into the same two workers.
  raay-nginx:
    image: nginx:alpine
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/nginx_canary.conf:/etc/nginx/conf.d/canary.conf:ro
    depends_on:
      raay-sentiment:
        condition: service_healthy
      raay-sentiment-canary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  queue-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
