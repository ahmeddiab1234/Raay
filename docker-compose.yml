# RAAY_IMAGE defaults to the locally built image. A release deploy should pin
# the immutable tag that .github/workflows/cd.yml published, never `latest`:
#
#   RAAY_IMAGE=ghcr.io/ahmeddiab1234/arabic-sentiment:<commit-sha> \
#     docker compose pull raay-sentiment && docker compose up -d --no-build
#
# `--no-build` matters: these services carry a `build:` block for local image
# work, so without it compose rebuilds the repo image instead of using the
# pulled one.
#
# The shadow/canary rollout is a SEPARATE project (docker-compose.canary.yml,
# `name: canary`) -- it owns :8000 through its own nginx front while it runs.
services:
  raay-sentiment:
    image: ${RAAY_IMAGE:-raay-sentiment:latest}
    build:
      context: .
    ports:
      - "8000:3000"
    environment:
      RAAY_ONNX_PATH: /home/bentoml/bento/src/models/onnx/model_int8.onnx
      RAAY_TOKENIZER_DIR: /home/bentoml/bento/src/models/baseline/final
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ALLOW_FILE_STORE: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  queue-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
