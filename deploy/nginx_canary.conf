# Canary rollout front for the Raay sentiment service (Phase 5 step 4).
#
# Weighted 95/5 split over TWO BentoML workers on the same compose network.
# Both are resolved by *docker compose service name*, so no host ports are
# needed on the canary worker -- nginx talks to it over the private network.
#
#   upstream  raay-sentiment       weight 95  -> Production alias (INT8)
#   upstream  raay-sentiment-canary weight  5  -> Canary alias     (distilled fp32)
#
# The Production worker keeps its direct :8000 publish -- untouched. This
# :8081 front is additive; nothing about the existing :8000 mapping changes.
#
# Weights are *request*-level (nginx round-robin with weights), not
# resource-level. On this 2-core CPU the canary worker shares cores with prod,
# so a small latency sawtooth on the 5% slice is expected CPU contention, not
# a canary signal -- the behavioral gate is the nightly PSI drift check
# (raay_nightly_batch_scoring), not nginx latency.

upstream raay_sentiment_backend {
    server raay-sentiment:3000 weight=95;
    server raay-sentiment-canary:3000 weight=5;
}

server {
    listen 8081;

    location /predict {
        proxy_pass http://raay_sentiment_backend/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://raay_sentiment_backend/health;
        proxy_set_header Host $host;
    }
}
