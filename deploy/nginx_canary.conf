# Phase 5 step 5 -- nginx front for the shadow/canary rollout.
# Generated by scripts/canary_promote.py -- do not hand-edit.
# Stage: shadow (stable=100, candidate=0, mirror=yes)

upstream raay_sentiment_backend {
    server raay-sentiment:3000 weight=100;
    server raay-sentiment-canary:3000 weight=0;
}

server {
    listen 8000;
    listen 8081;

    location /predict {
        proxy_pass http://raay_sentiment_backend/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Raay-Shadow 1;
        mirror /shadow;
    }

    location /shadow {
        proxy_pass http://raay-sentiment-canary:3000/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Raay-Shadow 1;
    }

    location /health {
        proxy_pass http://raay_sentiment_backend/health;
        proxy_set_header Host $host;
    }
}
