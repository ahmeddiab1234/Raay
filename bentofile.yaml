service: "raay.serving.serve:svc"
name: "raay-sentiment"
description: |
  Real-time Arabic e-commerce review sentiment API over the CPU INT8
  AraBERT ONNX graph. POST /predict with {"texts": [...]}; GET /health
  liveness probe.

labels:
  stage: production
  variant: onnx-int8
  # NOTE: these are BentoML bento labels. They are NOT emitted as OCI image
  # labels by this BentoML version (the generated Dockerfile template has no
  # LABEL instruction), so the model version reaches the image through
  # `bentoml containerize --label` in .github/workflows/cd.yml, which forwards
  # to the OCI builder directly.

include:
  - "src/raay/**"
  - "models/baseline/final/config.json"
  - "models/baseline/final/tokenizer.json"
  - "models/baseline/final/tokenizer_config.json"
  - "models/onnx/model_int8.onnx"

envs:
  - name: "PYTHONPATH"
    value: "/home/bentoml/bento/src"
  # BENTOML_ENV_<name> below is emitted by BentoML as `ARG <name>=<default>`
  # followed by `ENV <name>=$<name>` in the generated Dockerfile, so a plain
  # local `bentoml build`/`containerize` keeps the placeholder while CI
  # overrides it with
  # `bentoml containerize --build-arg RAAY_MODEL_VERSION=int8-<dvc-md5[:12]>`.
  # serve.py reports it as `model_version` on /predict and /health, which is
  # what makes a response traceable to the exact graph bytes in the image.
  - name: "RAAY_MODEL_VERSION"
    value: "unversioned"
  # The image bakes its own graph, so it must not fall back to serve.py's default
  # of the MLflow registry alias: the container carries no registry (and the
  # Dagshub store is not reachable from a released image), so /predict would
  # 500 with "Registered Model with name=ArabicSentiment not found". These
  # point at the bytes under `include` above, which is what makes the image
  # self-contained. The canary worker overrides them via compose.
  - name: "RAAY_ONNX_PATH"
    value: "/home/bentoml/bento/src/models/onnx/model_int8.onnx"
  - name: "RAAY_TOKENIZER_DIR"
    value: "/home/bentoml/bento/src/models/baseline/final"

python:
  is_src_layout: true
  packages:
    - "--extra-index-url https://download.pytorch.org/whl/cpu"
    - "arabert>=1.0.1"
    - "loguru>=0.7.3"
    - "mlflow>=3.15.1"
    - "numpy>=2.5.2"
    - "onnxruntime>=1.18.0"
    - "pydantic>=2.13.4"
    - "python-dotenv>=1.2.3"
    - "starlette>=0.46.0"
    - "torch>=2.13.0"
    - "transformers>=5.15.1"

docker:
  python_version: "3.12"
