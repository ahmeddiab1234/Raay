[project]
name = "raay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahmeddiab1234", email = "shhth0034@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "bentoml>=1.4.39",
    "datasets>=5.0.1",
    "dvc[s3]>=3.67.1",
    "hydra-core>=1.3.5",
    "loguru>=0.7.3",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "typer>=0.27.1",
]

[project.scripts]
raay = "raay:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "notebook>=7.6.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
