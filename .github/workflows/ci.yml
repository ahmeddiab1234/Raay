name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

# Least privilege: the metrics comment is the only thing that needs more than
# read access, and only on same-repo pull requests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # --frozen keeps CI from silently re-resolving uv.lock, so a stale lock fails
  # loudly instead of installing something the PR never tested.
  UV_FLAGS: "--frozen --all-extras"
  DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  MLFLOW_TRACKING_URI: https://dagshub.com/shhth0034/Raay.mlflow
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync ${{ env.UV_FLAGS }}

      - name: Ruff lint
        run: uv run ${{ env.UV_FLAGS }} ruff check .

      - name: Ruff format
        run: uv run ${{ env.UV_FLAGS }} ruff format --check .

      - name: Mypy
        run: uv run ${{ env.UV_FLAGS }} mypy src

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync ${{ env.UV_FLAGS }}

      - name: Pytest with coverage
        run: |
          uv run ${{ env.UV_FLAGS }} pytest \
            --cov=raay \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/coverage.xml reports/junit.xml
          if-no-files-found: ignore

  pipeline:
    name: DVC pipeline & metrics gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    # The PR comment is the only write this workflow performs.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # fetch-depth: 0 -- the metrics gate diffs against a base revision, so a
      # shallow clone would have nothing to compare against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync ${{ env.UV_FLAGS }}

      - name: Configure DVC remote credentials
        # .dvc/config.local is git-ignored on purpose: the tracked
        # .dvc/config only holds the remote URL.
        run: |
          mkdir -p .dvc
          cat > .dvc/config.local <<EOF
          [core]
              remote = dagshub
          ['remote "dagshub"']
              url = https://dagshub.com/shhth0034/Raay.dvc
              user = ${DAGSHUB_USER}
              password = ${DAGSHUB_TOKEN}
          EOF

      - name: Pull the raw input
        # Only the raw CSV is pulled. `dvc pull <stage>` fetches that stage's
        # outputs but not its dependencies' outputs, and a bare `dvc pull`
        # would also drag in the unrelated 212 MB reviews CSV. Everything else
        # is rebuilt by `dvc repro` below.
        run: uv run ${{ env.UV_FLAGS }} dvc pull data/raw/Final_Data.csv.dvc

      - name: Reproduce pipeline
        run: uv run ${{ env.UV_FLAGS }} dvc repro

      - name: Check for untracked pipeline outputs
        run: |
          status=$(uv run ${{ env.UV_FLAGS }} dvc status)
          echo "$status"
          if ! grep -q "up to date" <<<"$status"; then
            echo "::error::DVC reported a dirty pipeline after repro."
            exit 1
          fi

      - name: Resolve the metrics baseline revision
        id: base
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tip="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "$zero" ]; then
            tip="${{ github.event.before }}"
          else
            # Manual runs, and the first push of a branch.
            tip="HEAD~1"
          fi
          # Compare against where this branch forked off rather than the tip of
          # the base branch, so metrics that landed on dev meanwhile are not
          # blamed on the pull request.
          if base=$(git merge-base "$tip" HEAD); then
            echo "Comparing metrics against merge-base $base (from $tip)."
          else
            base="$tip"
            echo "::warning::No merge-base with $tip; comparing against it directly."
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Metrics drift gate (+/-0.005)
        id: gate
        continue-on-error: true
        run: |
          uv run ${{ env.UV_FLAGS }} python scripts/ci_metrics_gate.py \
            --base "${{ steps.base.outputs.base }}" \
            --threshold 0.005 \
            --markdown reports/metrics_diff.md

      - name: Install CML
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: iterative/setup-cml@v3
        with:
          # Vega needs libcairo2-dev/libpango1.0-dev system packages that are not
          # on the runner by default, and the metrics report has no charts.
          vega: false

      - name: Post the metrics report on the PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f reports/metrics_diff.md ]; then
            echo "::error::The metrics gate exited before writing a report; see the job log." \
              > reports/metrics_diff.md
          fi
          cml comment create reports/metrics_diff.md

      - name: Explain the skipped pipeline on forks
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork
        run: |
          echo "::notice::Pull request is from a fork: the DVC and MLflow steps" \
            "were skipped because DAGSHUB_TOKEN is not available there. The lint" \
            "and test jobs still ran."

      - name: Fail on metrics drift
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::DVC metrics drifted beyond +/-0.005 (see the PR comment)."
          exit 1

      - name: Fail if dvc.lock is not reproducible
        # Runs last on purpose: the lock embeds the metrics files' hashes, so a
        # metrics change gets explained by the gate above before this raw diff.
        run: |
          if ! git diff --exit-code dvc.lock; then
            echo "::error::dvc.lock changed after repro -- the pipeline is not" \
              "reproducible from data/raw/Final_Data.csv."
            git diff dvc.lock
            exit 1
          fi
